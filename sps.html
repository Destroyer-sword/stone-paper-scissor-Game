<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sps.css">
    <title>Stone Paper and Scissor</title>
</head>
<body>
    <div class="container">
        <div class="message"> Choose an option</div>
    <div class="images">
    <div class="computer">
        <img src="scissorcomputer.png" alt="Computer Choice" class="symbol-icon"/>
    </div>
     <div class="player">
        <img src="scissorplayer.png" alt="Player Choice" class="symbol-icon"/>
     </div>
    </div>
        <div class="points">
            COMPUTER<span class="computerPoints"> 0 </span>/
            <span class="playerPoints"> 0 </span>PLAYER
        </div>
        <div class ="option">
            <button type="button">STONE</button>
            <button type="button">PAPER</button>
            <button type="button">SCISSOR</button>
        </div>
    </div>
    <script src="sps.js"></script>
    
</body>
</html>
